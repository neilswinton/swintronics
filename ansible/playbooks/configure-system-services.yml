---
# Configure host-level system services:
#   - unattended-upgrades for automatic security patches
#   - reboot-scheduled hook: Telegram notice when updates flag a pending reboot
#   - pre-reboot hook: runs at shutdown while the network is still up (ExecStop
#     pattern); records the shutdown reason, widens the healthchecks.io grace
#     window (never pauses it — see issue #118), notifies Telegram
#   - post-boot hook: wait for Gatus, restore the normal healthchecks.io grace
#     (Telegram alert on failure)
#   - boot-notify hook: send a Telegram message on every boot including the
#     recorded shutdown reason (catches crashes and watchdog-triggered reboots,
#     not just planned shutdowns)
#
# Usage:
#   ansible-playbook playbooks/configure-system-services.yml

- name: Configure host system services
  hosts: "{{ target | default('clusters') }}"
  become: yes

  pre_tasks:
    - name: Login to Infisical
      infisical.vault.login:
        url: "https://app.infisical.com"
        auth_method: universal_auth
        universal_auth_client_id: "{{ infisical_client_id }}"
        universal_auth_client_secret: "{{ infisical_client_secret }}"
      register: infisical_login
      delegate_to: localhost
      check_mode: no

    - name: Fetch secrets from Infisical
      infisical.vault.read_secrets:
        login_data: "{{ infisical_login.login_data }}"
        project_id: "{{ infisical_project_id }}"
        env_slug: "{{ infisical_environment }}"
        path: "/"
        as_dict: true
      register: infisical_secrets
      delegate_to: localhost
      check_mode: no

  tasks:
    # ── Install packages ──────────────────────────────────────────────────────

    - name: Install unattended-upgrades
      apt:
        name:
          - unattended-upgrades
          - apt-listchanges
          - jq   # parses the HA state response in updates-common.sh
        state: present
        update_cache: yes

    # ── Configure unattended-upgrades ─────────────────────────────────────────

    - name: Configure unattended-upgrades
      copy:
        dest: /etc/apt/apt.conf.d/50swintronics-unattended-upgrades
        content: |
          // Swintronics unattended-upgrades configuration.
          // Managed by Ansible. Do not edit — changes will be overwritten on next deployment.

          Unattended-Upgrade::Allowed-Origins {
              "${distro_id}:${distro_codename}-security";
              "${distro_id}ESMApps:${distro_codename}-apps-security";
              "${distro_id}ESM:${distro_codename}-infra-security";
          };

          Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
          Unattended-Upgrade::Remove-New-Unused-Dependencies "true";
          Unattended-Upgrade::Remove-Unused-Dependencies "false";
          Unattended-Upgrade::Automatic-Reboot "true";
          // Reboot at 03:00, after the 02:00 immich DB dump and before the 04:00 backup cron.
          Unattended-Upgrade::Automatic-Reboot-Time "03:00";
        mode: '0644'
      notify: restart unattended-upgrades

    - name: Enable unattended-upgrades service
      service:
        name: unattended-upgrades
        enabled: yes
        state: started

    # ── Store monitoring credentials for reboot scripts ───────────────────────
    # These tasks require HEALTHCHECKS_API_KEY in Infisical — skip for clusters
    # that haven't set up healthchecks.io yet.

    - name: Check if monitoring secrets are available
      ansible.builtin.set_fact:
        _has_monitoring_secrets: "{{ 'HEALTHCHECKS_API_KEY' in infisical_secrets.secrets }}"

    # Unconditional: also holds the away flag, which works without any secrets.
    - name: Create /etc/swintronics directory
      file:
        path: /etc/swintronics
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Deploy monitoring credentials
      copy:
        dest: /etc/swintronics/monitoring.env
        content: |
          HEALTHCHECKS_API_KEY={{ infisical_secrets.secrets.HEALTHCHECKS_API_KEY }}
          HEALTHCHECKS_HEARTBEAT_CHECK_UUID={{ infisical_secrets.secrets.HEALTHCHECKS_HEARTBEAT_CHECK_UUID }}
          TELEGRAM_BOT_TOKEN={{ infisical_secrets.secrets.SERVER_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID={{ infisical_secrets.secrets.SERVER_TELEGRAM_CHAT_ID }}
        owner: root
        group: root
        mode: '0600'
      when: _has_monitoring_secrets

    # ── OS update monitoring + away mode: shared pieces (issue #153) ──────────
    # The nightly security-updates check and the weekly full-upgrade report to
    # Gatus external endpoints with GATUS_PUSH_TOKEN; both are skipped until
    # Terraform has created that secret. HA_AWAY_MODE_TOKEN is a manually
    # created HA long-lived token (see CLAUDE.md); without it, away_source=ha
    # resolves presence as "unknown", so the weekly upgrade skips and alerts.

    - name: Check if update-monitoring secrets are available
      ansible.builtin.set_fact:
        _has_update_secrets: "{{ 'GATUS_PUSH_TOKEN' in infisical_secrets.secrets }}"

    - name: Deploy update-monitoring credentials
      copy:
        dest: /etc/swintronics/updates.env
        content: |
          # Managed by Ansible. Do not edit — changes will be overwritten on next deployment.
          GATUS_BASE_URL=https://gatus.{{ server_domain }}
          GATUS_PUSH_TOKEN={{ infisical_secrets.secrets.GATUS_PUSH_TOKEN }}
          AWAY_SOURCE={{ away_source }}
          HA_URL=https://ha.{{ server_domain }}
          {% if 'HA_AWAY_MODE_TOKEN' in infisical_secrets.secrets %}
          HA_AWAY_MODE_TOKEN={{ infisical_secrets.secrets.HA_AWAY_MODE_TOKEN }}
          {% endif %}
        owner: root
        group: root
        mode: '0600'
      when: _has_update_secrets

    - name: Create /usr/local/lib/swintronics directory
      file:
        path: /usr/local/lib/swintronics
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Deploy update-jobs shared helpers
      copy:
        dest: /usr/local/lib/swintronics/updates-common.sh
        content: |
          # Shared helpers for the swintronics OS-update jobs. Sourced, not run.
          # Managed by Ansible. Do not edit — changes will be overwritten on next deployment.

          SWINTRONICS_ETC=/etc/swintronics
          AWAY_FLAG="${SWINTRONICS_ETC}/away"
          UPDATES_ENV="${SWINTRONICS_ETC}/updates.env"

          # Read directly rather than via EnvironmentFile= so the systemd units
          # and the interactive swintronics-away CLI see the same settings.
          if [[ -r "${UPDATES_ENV}" ]]; then
              set -a
              # shellcheck source=/dev/null
              . "${UPDATES_ENV}"
              set +a
          fi

          log() { echo "$(basename "$0"): $*"; }

          # push_gatus <endpoint-key> <true|false> [error message]
          # Gatus is the only alert path for these jobs; a failed push is
          # logged, and the endpoint's heartbeat catches a job that never
          # reports.
          push_gatus() {
              local key="$1" success="$2" error="${3:-}"
              if [[ -z "${GATUS_BASE_URL:-}" || -z "${GATUS_PUSH_TOKEN:-}" ]]; then
                  log "warning: Gatus push not configured; not reporting ${key} success=${success}"
                  return 0
              fi
              local args=(--data-urlencode "success=${success}")
              [[ -n "${error}" ]] && args+=(--data-urlencode "error=${error}")
              log "pushing to Gatus: ${key} success=${success}${error:+ error=${error}}"
              curl -fsS -o /dev/null --max-time 15 --retry 3 -G -X POST \
                  -H "Authorization: Bearer ${GATUS_PUSH_TOKEN}" \
                  "${args[@]}" \
                  "${GATUS_BASE_URL}/api/v1/endpoints/${key}/external" \
                  || log "warning: Gatus push failed for ${key}"
          }

          # resolve_presence sets PRESENCE to:
          #   home     — a clear "home" answer; the only value that allows the
          #              weekly upgrade
          #   away     — explicitly away (flag file, or HA away_mode=on)
          #   unknown  — couldn't be determined; callers treat it as away
          # and PRESENCE_REASON to a human-readable explanation.
          resolve_presence() {
              PRESENCE=unknown
              PRESENCE_REASON=""
              local source="${AWAY_SOURCE:-file}"

              if [[ ! -d "${SWINTRONICS_ETC}" || ! -r "${SWINTRONICS_ETC}" || ! -x "${SWINTRONICS_ETC}" ]]; then
                  PRESENCE_REASON="${SWINTRONICS_ETC} missing or unreadable"
              elif [[ -e "${AWAY_FLAG}" ]]; then
                  # The flag overrides HA (manual override), whatever the source.
                  PRESENCE=away
                  PRESENCE_REASON="flag file ${AWAY_FLAG} present"
              elif [[ "${source}" == "file" ]]; then
                  PRESENCE=home
                  PRESENCE_REASON="flag file ${AWAY_FLAG} absent"
              elif [[ "${source}" == "ha" ]]; then
                  _presence_from_ha
              else
                  PRESENCE_REASON="unknown away_source '${source}'"
              fi
              log "presence: source=${source} result=${PRESENCE} (${PRESENCE_REASON})"
          }

          _presence_from_ha() {
              if [[ -z "${HA_URL:-}" || -z "${HA_AWAY_MODE_TOKEN:-}" ]]; then
                  PRESENCE_REASON="HA_URL or HA_AWAY_MODE_TOKEN not configured"
                  return
              fi
              local body code state
              body=$(mktemp)
              code=$(curl -sS -o "${body}" -w '%{http_code}' --max-time 15 --retry 2 \
                  -H "Authorization: Bearer ${HA_AWAY_MODE_TOKEN}" \
                  "${HA_URL}/api/states/input_boolean.away_mode" 2>/dev/null) || code="000"
              if [[ "${code}" != "200" ]]; then
                  PRESENCE_REASON="HA input_boolean.away_mode returned HTTP ${code}"
              else
                  state=$(jq -r '.state // empty' "${body}" 2>/dev/null) || state=""
                  case "${state}" in
                      off) PRESENCE=home; PRESENCE_REASON="HA away_mode=off" ;;
                      on)  PRESENCE=away; PRESENCE_REASON="HA away_mode=on" ;;
                      *)   PRESENCE_REASON="HA away_mode state '${state:-<none>}'" ;;
                  esac
              fi
              rm -f "${body}"
          }
        owner: root
        group: root
        mode: '0644'

    - name: Deploy swintronics-away CLI
      copy:
        dest: /usr/local/sbin/swintronics-away
        content: |
          #!/bin/bash
          # Manage the local away flag that gates the weekly full-upgrade.
          #   swintronics-away on      — set the flag (away, overrides HA)
          #   swintronics-away off     — clear the flag
          #   swintronics-away status  — show the resolved presence (default)
          # Managed by Ansible. Do not edit — changes will be overwritten on next deployment.
          set -euo pipefail

          # /etc/swintronics is root-only (0700).
          if [[ ${EUID} -ne 0 ]]; then
              exec sudo "$0" "$@"
          fi

          # shellcheck source=/dev/null
          . /usr/local/lib/swintronics/updates-common.sh

          case "${1:-status}" in
              on)
                  touch "${AWAY_FLAG}"
                  echo "Away flag set: the weekly full-upgrade will skip until 'swintronics-away off'."
                  ;;
              off)
                  rm -f "${AWAY_FLAG}"
                  echo "Away flag cleared."
                  [[ "${AWAY_SOURCE:-file}" == "ha" ]] && echo "Presence now follows HA input_boolean.away_mode."
                  ;;
              status)
                  ;;
              *)
                  echo "usage: $(basename "$0") on|off|status" >&2
                  exit 2
                  ;;
          esac
          resolve_presence
          if [[ "${PRESENCE}" == "home" ]]; then
              echo "Weekly full-upgrade: will run."
          else
              echo "Weekly full-upgrade: will skip (${PRESENCE})."
          fi
        owner: root
        group: root
        mode: '0755'

    # ── Nightly security updates: Gatus heartbeat ─────────────────────────────
    # Installs and the 03:00 reboot are unchanged (unattended-upgrades config
    # above). A drop-in on apt-daily-upgrade.service reports each run to the
    # Gatus "Security updates" endpoint (26h heartbeat). apt.systemd.daily
    # doesn't reliably exit non-zero when unattended-upgrades fails, so the
    # check reads the stamp, the log and the remaining security updates.

    - name: Deploy security-updates check script
      when: _has_update_secrets
      copy:
        dest: /usr/local/sbin/swintronics-security-updates-check.sh
        content: |
          #!/bin/bash
          # Report the nightly unattended-upgrades run to Gatus. Hooked into
          # apt-daily-upgrade.service by a drop-in:
          #   --mark-start      ExecStartPre: record when this run started
          #   (no argument)     ExecStartPost: check the run, push the result
          #   --service-failed  OnFailure= unit: the service itself failed
          # Always exits 0 so a check problem never fails the apt service.
          # Managed by Ansible. Do not edit — changes will be overwritten on next deployment.
          set -uo pipefail

          # shellcheck source=/dev/null
          . /usr/local/lib/swintronics/updates-common.sh

          KEY=system-updates_security-updates
          MARKER=/run/swintronics/security-updates-start
          # Written by unattended-upgrade itself on each run.
          UU_STAMP=/var/lib/apt/periodic/unattended-upgrades-stamp
          # apt.systemd.daily's own gate: unattended-upgrade runs at most once
          # per calendar day, keyed on this stamp's date.
          GATE_STAMP=/var/lib/apt/periodic/upgrade-stamp
          UU_LOG=/var/log/unattended-upgrades/unattended-upgrades.log

          case "${1:-}" in
              --mark-start)
                  mkdir -p "$(dirname "${MARKER}")"
                  touch "${MARKER}"
                  exit 0
                  ;;
              --service-failed)
                  push_gatus "${KEY}" false "apt-daily-upgrade.service failed"
                  exit 0
                  ;;
              "")
                  ;;
              *)
                  echo "usage: $(basename "$0") [--mark-start|--service-failed]" >&2
                  exit 0
                  ;;
          esac

          if [[ ! -e "${MARKER}" ]]; then
              push_gatus "${KEY}" false "start marker missing; drop-in ExecStartPre did not run"
              exit 0
          fi

          if [[ ! "${UU_STAMP}" -nt "${MARKER}" ]]; then
              # A second start on the same day (manual `systemctl start`, or a
              # Persistent= catch-up) legitimately skips unattended-upgrade.
              # The day's first run already reported, so stay quiet.
              if [[ -e "${GATE_STAMP}" && "$(date -r "${GATE_STAMP}" +%F)" == "$(date +%F)" ]]; then
                  log "unattended-upgrade already ran today; not reporting"
                  exit 0
              fi
              push_gatus "${KEY}" false "unattended-upgrades did not run (stamp not updated)"
              exit 0
          fi

          # This run's section of the log: from its last "Starting" line on.
          errors=$(tac "${UU_LOG}" 2>/dev/null \
              | sed '/Starting unattended upgrades script/q' \
              | tac | grep ' ERROR ' || true)
          if [[ -n "${errors}" ]]; then
              count=$(wc -l <<<"${errors}")
              first=$(head -n1 <<<"${errors}" | sed 's/^.* ERROR //' | cut -c1-200)
              push_gatus "${KEY}" false "unattended-upgrades logged ${count} ERROR line(s): ${first}"
              exit 0
          fi

          # dist-upgrade, not upgrade: upgrade lists new kernel packages as
          # "kept back", so pending kernel security updates would be missed.
          # A pending reboot doesn't count — installed packages are current.
          if ! sim=$(apt-get -s dist-upgrade 2>&1); then
              push_gatus "${KEY}" false "apt-get -s dist-upgrade failed: $(tail -n1 <<<"${sim}" | cut -c1-200)"
              exit 0
          fi
          pending=$(awk '/^Inst / && /-security/ {print $2}' <<<"${sim}" | sort -u | tr '\n' ' ')
          if [[ -n "${pending}" ]]; then
              push_gatus "${KEY}" false "security updates still pending: ${pending% }"
              exit 0
          fi

          push_gatus "${KEY}" true
          exit 0
        owner: root
        group: root
        mode: '0755'

    - name: Deploy security-updates failure systemd unit
      when: _has_update_secrets
      copy:
        dest: /etc/systemd/system/swintronics-security-updates-failed.service
        content: |
          [Unit]
          Description=Swintronics: report apt-daily-upgrade.service failure to Gatus

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/swintronics-security-updates-check.sh --service-failed
        mode: '0644'
      notify: reload systemd

    - name: Create apt-daily-upgrade.service drop-in directory
      when: _has_update_secrets
      file:
        path: /etc/systemd/system/apt-daily-upgrade.service.d
        state: directory
        mode: '0755'

    - name: Deploy apt-daily-upgrade.service Gatus drop-in
      when: _has_update_secrets
      copy:
        dest: /etc/systemd/system/apt-daily-upgrade.service.d/swintronics-gatus.conf
        content: |
          # Managed by Ansible. Do not edit — changes will be overwritten on next deployment.
          # Report each nightly unattended-upgrades run to Gatus (issue #153).
          # "-" prefixes: a problem in the check must never fail the apt run.
          [Unit]
          OnFailure=swintronics-security-updates-failed.service

          [Service]
          ExecStartPre=-/usr/local/sbin/swintronics-security-updates-check.sh --mark-start
          ExecStartPost=-/usr/local/sbin/swintronics-security-updates-check.sh
        mode: '0644'
      notify: reload systemd

    # ── Weekly full-upgrade (away-aware) ──────────────────────────────────────
    # Applies everything unattended-upgrades leaves alone (-updates pocket,
    # Docker and Tailscale repos), only when presence resolves to "home".
    # Runs as its own systemd unit so it's outside any SSH session and outside
    # tailscaled's cgroup: a dropped connection can't kill it mid-dpkg.
    # Reports to the Gatus "Full upgrade" endpoint (8d heartbeat).

    - name: Deploy full-upgrade script
      when: _has_update_secrets
      copy:
        dest: /usr/local/sbin/swintronics-full-upgrade.sh
        content: |
          #!/bin/bash
          # Weekly away-aware full-upgrade. Tailscale is held during the main
          # upgrade and upgraded last, alone. Every exit path reports to Gatus.
          # Managed by Ansible. Do not edit — changes will be overwritten on next deployment.
          set -uo pipefail

          # shellcheck source=/dev/null
          . /usr/local/lib/swintronics/updates-common.sh

          KEY=system-updates_full-upgrade
          export DEBIAN_FRONTEND=noninteractive
          # needrestart isn't installed today; if it ever is, "l" (list only)
          # stops it restarting tailscaled or dockerd mid-upgrade.
          export NEEDRESTART_MODE=l
          APT_OPTS=(-y -o DPkg::Lock::Timeout=600
                    -o Dpkg::Options::=--force-confdef
                    -o Dpkg::Options::=--force-confold)

          STEP="startup"
          REPORTED=0
          HELD=0

          report() {
              REPORTED=1
              push_gatus "${KEY}" "$@"
          }

          # shellcheck disable=SC2317  # reached via the EXIT trap
          release_hold() {
              if (( HELD )); then
                  apt-mark unhold tailscale >/dev/null && HELD=0
              fi
          }

          # shellcheck disable=SC2317  # reached via the EXIT trap
          on_exit() {
              local rc=$?
              release_hold
              if (( ! REPORTED )); then
                  report false "exited unexpectedly (exit ${rc}) during ${STEP}"
              fi
          }
          trap on_exit EXIT
          # Without these, SIGTERM/SIGINT would kill bash without running the
          # EXIT trap (hold left in place, nothing reported).
          trap 'exit 143' TERM
          trap 'exit 130' INT

          fail() {
              report false "$1"
              exit 1
          }

          # run <step description> <command...>
          run() {
              STEP="$1"
              shift
              log "step: ${STEP}"
              "$@" || fail "${STEP} failed (exit $?)"
          }

          # retry_for <seconds> <command...>: retry every 5s until success.
          retry_for() {
              local deadline=$(( SECONDS + $1 ))
              shift
              until "$@" >/dev/null 2>&1; do
                  (( SECONDS >= deadline )) && return 1
                  sleep 5
              done
          }

          # 1. Presence. Only a clear "home" proceeds.
          STEP="presence"
          resolve_presence
          case "${PRESENCE}" in
              home)
                  ;;
              away)
                  # A deliberate skip is healthy: keep the endpoint green.
                  log "skipped: away (${PRESENCE_REASON})"
                  report true
                  exit 0
                  ;;
              *)
                  report false "skipped: presence could not be determined (${PRESENCE_REASON})"
                  exit 0
                  ;;
          esac

          HAS_TAILSCALE=0
          dpkg-query -W -f='${Status}' tailscale 2>/dev/null | grep -q 'install ok installed' && HAS_TAILSCALE=1

          # 2. Clear a stale hold left by a run killed by SIGKILL / power loss,
          #    whose trap never ran.
          if (( HAS_TAILSCALE )); then
              run "clear stale tailscale hold" apt-mark unhold tailscale
          fi

          # 3. Finish any interrupted dpkg run. dpkg has no lock timeout, so
          #    retry for up to 10 min in case apt-daily is mid-run.
          STEP="dpkg --configure -a"
          log "step: ${STEP}"
          retry_for 600 dpkg --configure -a || fail "${STEP} failed"

          # 4.
          run "apt-get update" apt-get "${APT_OPTS[@]}" update

          # 5. Hold tailscale for the main upgrade; the EXIT trap releases it.
          if (( HAS_TAILSCALE )); then
              run "hold tailscale" apt-mark hold tailscale
              HELD=1
          fi

          # 6. Simulate. Removals need a human.
          STEP="simulate full-upgrade"
          log "step: ${STEP}"
          if ! sim=$(apt-get -s full-upgrade 2>&1); then
              fail "${STEP} failed: $(tail -n1 <<<"${sim}" | cut -c1-200)"
          fi
          removals=$(awk '/^Remv / {print $2}' <<<"${sim}" | sort -u | tr '\n' ' ')
          if [[ -n "${removals}" ]]; then
              fail "aborted: plan removes packages: ${removals% }"
          fi

          # 7. Main upgrade, no prompts, keep existing config files. Packages
          #    "kept back" by phased updates are expected.
          run "apt-get full-upgrade" apt-get "${APT_OPTS[@]}" full-upgrade

          # 8.
          run "apt-get autoremove" apt-get "${APT_OPTS[@]}" autoremove

          # 9. Tailscale last and alone: a connection drop now is harmless.
          if (( HAS_TAILSCALE )); then
              run "unhold tailscale" apt-mark unhold tailscale
              HELD=0
              run "upgrade tailscale" apt-get "${APT_OPTS[@]}" install --only-upgrade tailscale
          fi

          # 10. Health checks. Upgraded daemons may still be restarting.
          STEP="health checks"
          log "step: ${STEP}"
          if (( HAS_TAILSCALE )) && ! retry_for 120 tailscale status; then
              fail "tailscale status failed after upgrade"
          fi
          retry_for 120 docker info || fail "docker info failed after upgrade"

          # A Docker Engine upgrade restarts every container, Gatus included,
          # and Gatus delays its start. Wait so the result isn't lost.
          if ! retry_for 600 curl -fsS --max-time 10 "${GATUS_BASE_URL}/health"; then
              log "warning: Gatus not reachable after 10 min; pushing anyway"
          fi
          report true

          # 11. The job only runs when someone is home; the pre-reboot and
          #     boot-notify hooks cover the reboot itself.
          if [[ -e /run/reboot-required ]]; then
              log "reboot required; rebooting"
              systemctl reboot
          fi
          exit 0
        owner: root
        group: root
        mode: '0755'

    - name: Deploy full-upgrade systemd service
      when: _has_update_secrets
      copy:
        dest: /etc/systemd/system/swintronics-full-upgrade.service
        content: |
          [Unit]
          Description=Swintronics weekly full-upgrade (away-aware)
          After=network-online.target docker.service
          Wants=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/swintronics-full-upgrade.sh
          TimeoutStartSec=2h
          # As apt-daily-upgrade.service: on stop, signal only the script (its
          # trap reports and releases the hold) rather than killing dpkg.
          KillMode=process
        mode: '0644'
      notify: reload systemd

    - name: Deploy full-upgrade systemd timer
      when: _has_update_secrets
      copy:
        dest: /etc/systemd/system/swintronics-full-upgrade.timer
        content: |
          [Unit]
          Description=Swintronics weekly full-upgrade

          [Timer]
          OnCalendar={{ full_upgrade_on_calendar }}
          # No catch-up: a missed run would otherwise fire at boot, possibly
          # overnight. The Gatus 8d heartbeat alerts on a missed week.
          Persistent=false

          [Install]
          WantedBy=timers.target
        mode: '0644'
      notify: reload systemd

    - name: Enable and start full-upgrade timer
      systemd:
        name: swintronics-full-upgrade.timer
        enabled: yes
        state: started
        daemon_reload: yes   # unit may have been written just above, before handlers run
      when: _has_update_secrets
      # In check mode the unit file hasn't actually been written yet
      ignore_errors: "{{ ansible_check_mode }}"

    # ── Reboot-scheduled hook (advance notice) ────────────────────────────────
    # unattended-upgrades installs updates in the morning but reboots at 03:00
    # the following night. A path unit watches for /run/reboot-required so the
    # Telegram notice goes out when the reboot is flagged, not when it happens.

    - name: Deploy reboot-scheduled script
      when: _has_monitoring_secrets
      copy:
        dest: /usr/local/sbin/swintronics-reboot-scheduled.sh
        content: |
          #!/bin/bash
          # Telegram notice that installed updates require a reboot; unattended-upgrades
          # will reboot at its configured 03:00 window.
          # Managed by Ansible. Do not edit — changes will be overwritten on next deployment.
          set -euo pipefail

          # The path unit uses PathExists=/run/reboot-required, which re-triggers
          # this oneshot for as long as the flag exists. Guard with a per-boot
          # stamp so the notice is sent only once. /run is tmpfs, so the stamp
          # clears on reboot and the next update cycle re-arms cleanly.
          STAMP=/run/swintronics-reboot-notified
          [[ -e "$STAMP" ]] && exit 0
          touch "$STAMP"

          PKGS="unknown"
          if [[ -s /run/reboot-required.pkgs ]]; then
              PKGS=$(sort -u /run/reboot-required.pkgs | tr '\n' ' ')
          fi

          MESSAGE="🕒 $(hostname -s): updates require a reboot
          unattended-upgrades will reboot at 03:00 tonight
          Packages: ${PKGS}"

          curl -s -X POST \
              --max-time 10 \
              --retry 2 \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}" >/dev/null
        owner: root
        group: root
        mode: '0755'

    - name: Deploy reboot-scheduled systemd service
      when: _has_monitoring_secrets
      copy:
        dest: /etc/systemd/system/swintronics-reboot-scheduled.service
        content: |
          [Unit]
          Description=Swintronics: Telegram notice that a reboot is pending

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/swintronics-reboot-scheduled.sh
          EnvironmentFile=/etc/swintronics/monitoring.env
        mode: '0644'
      notify: reload systemd

    - name: Deploy reboot-scheduled systemd path unit
      when: _has_monitoring_secrets
      copy:
        dest: /etc/systemd/system/swintronics-reboot-scheduled.path
        content: |
          [Unit]
          Description=Swintronics: watch for pending reboot flag

          [Path]
          PathExists=/run/reboot-required

          [Install]
          WantedBy=multi-user.target
        mode: '0644'
      notify: reload systemd

    - name: Enable and start reboot-scheduled path unit
      systemd:
        name: swintronics-reboot-scheduled.path
        enabled: yes
        state: started
        daemon_reload: yes   # unit may have been written just above, before handlers run
      when: _has_monitoring_secrets
      # In check mode the unit file hasn't actually been written yet
      ignore_errors: "{{ ansible_check_mode }}"

    # ── Pre-reboot hook ───────────────────────────────────────────────────────

    - name: Deploy pre-reboot script
      when: _has_monitoring_secrets
      copy:
        dest: /usr/local/sbin/swintronics-pre-reboot.sh
        content: |
          #!/bin/bash
          # Runs as ExecStop of a boot-time unit, so it fires early in shutdown
          # while the network is still up. Records the shutdown reason for
          # boot-notify, widens the healthchecks.io grace window, and notifies
          # Telegram.
          # Managed by Ansible. Do not edit — changes will be overwritten on next deployment.
          set -euo pipefail

          # ExecStop also fires on manual `systemctl stop`/deploy restarts —
          # only act when the whole system is actually shutting down.
          if [[ "$(systemctl is-system-running)" != "stopping" ]]; then
              echo "swintronics-pre-reboot: not a system shutdown, skipping."
              exit 0
          fi

          REASON="planned shutdown (manual or unscheduled)"
          if [[ -f /run/reboot-required ]]; then
              PKGS=$(sort -u /run/reboot-required.pkgs 2>/dev/null | tr '\n' ' ' || true)
              REASON="unattended-upgrades (packages: ${PKGS:-unknown})"
          fi
          echo "swintronics-pre-reboot: recording shutdown reason: ${REASON}"
          mkdir -p /var/lib/swintronics
          printf '%s — %s\n' "$(date -Is)" "${REASON}" > /var/lib/swintronics/shutdown-reason

          # Widen the healthchecks.io grace window rather than pausing the check.
          # A paused check never alerts, so a reboot that never completed (BIOS
          # halt, dead disk, power loss during POST) failed silently — the box sat
          # down for 10.5h on 2026-07-29 with no notification (issue #118).
          # healthchecks.io is the only off-box watchdog: Gatus runs on this host,
          # so it dies with it. Leaving the check armed with a longer grace means a
          # normal reboot doesn't page, but a host that never comes back alerts once
          # the window expires. swintronics-post-boot.sh restores the normal grace.
          # -f so an HTTP error is actually reported: a silently-failing grace
          # update would leave the old, too-short window in place.
          GRACE_REBOOT={{ heartbeat_reboot_grace_seconds }}
          echo "swintronics-pre-reboot: widening healthchecks.io grace to ${GRACE_REBOOT}s..."
          curl -fsS -X POST \
            -H "X-Api-Key: ${HEALTHCHECKS_API_KEY}" \
            -H "Content-Type: application/json" \
            --max-time 5 \
            --retry 2 \
            -d "{\"grace\": ${GRACE_REBOOT}}" \
            "https://healthchecks.io/api/v3/checks/${HEALTHCHECKS_HEARTBEAT_CHECK_UUID}" >/dev/null || \
            echo "swintronics-pre-reboot: warning: healthchecks.io grace update failed (proceeding anyway)"

          echo "swintronics-pre-reboot: notifying via Telegram..."
          curl -s -X POST \
            --max-time 5 \
            --retry 1 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🔄 $(hostname -s): shutting down — ${REASON}" || \
            echo "swintronics-pre-reboot: warning: Telegram notify failed (proceeding anyway)"

          echo "swintronics-pre-reboot: done."
        owner: root
        group: root
        mode: '0755'

    - name: Deploy pre-reboot systemd unit
      when: _has_monitoring_secrets
      copy:
        dest: /etc/systemd/system/swintronics-pre-reboot.service
        content: |
          [Unit]
          Description=Swintronics pre-reboot: record shutdown reason, pause healthchecks.io
          # ExecStop pattern: the unit starts (a no-op) at boot and its ExecStop
          # runs at shutdown. systemd stops units in reverse start order, so
          # ordering After= the network stack means the script runs while the
          # network is still up — unlike a shutdown.target unit, which ran only
          # after NetworkManager/tailscaled were already down (issue #113).
          After=network-online.target systemd-resolved.service
          Wants=network-online.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/bin/true
          ExecStop=/usr/local/sbin/swintronics-pre-reboot.sh
          EnvironmentFile=/etc/swintronics/monitoring.env
          TimeoutStopSec=60

          [Install]
          WantedBy=multi-user.target
        mode: '0644'
      notify: reload systemd

    - name: Remove stale pre-reboot symlinks from shutdown targets
      file:
        path: "/etc/systemd/system/{{ item }}.wants/swintronics-pre-reboot.service"
        state: absent
      loop:
        - reboot.target
        - halt.target
        - shutdown.target
      when: _has_monitoring_secrets
      notify: reload systemd

    # ── Post-boot hook ────────────────────────────────────────────────────────

    - name: Deploy post-boot script
      when: _has_monitoring_secrets
      copy:
        dest: /usr/local/sbin/swintronics-post-boot.sh
        content: |
          #!/bin/bash
          # Wait for Gatus to come back up, then restore the healthchecks.io grace
          # window widened by swintronics-pre-reboot.sh.
          # Containers themselves are restarted by dockerd (restart: always); this script
          # just gates the grace restore on Gatus being ready to ping again.
          # Managed by Ansible. Do not edit — changes will be overwritten on next deployment.
          set -euo pipefail

          echo "swintronics-post-boot: waiting for Gatus container to be running..."
          timeout 120 bash -c \
            'until docker ps -q --filter name=^/gatus$ --filter status=running 2>/dev/null | grep -q .; do sleep 2; done'

          echo "swintronics-post-boot: waiting for Gatus startup delay ({{ gatus_delay_start_seconds + 30 }}s)..."
          sleep {{ gatus_delay_start_seconds + 30 }}

          # Defensive resume: the pre-reboot hook no longer pauses the check
          # (issue #118), but a check may still be stuck paused by a pre-#118
          # reboot or by a backup run that was killed between hc_pause and
          # hc_resume. No -f here: the API returns 409 when the check is not
          # paused, which is the expected case on a healthy boot.
          echo "swintronics-post-boot: resuming healthchecks.io monitor (409 = already running, ignored)..."
          curl -s -X POST \
            -H "X-Api-Key: ${HEALTHCHECKS_API_KEY}" \
            --max-time 5 \
            --retry 2 \
            "https://healthchecks.io/api/v3/checks/${HEALTHCHECKS_HEARTBEAT_CHECK_UUID}/resume" >/dev/null || \
            echo "swintronics-post-boot: warning: healthchecks.io resume failed (proceeding anyway)"

          # Restore the steady-state grace widened by swintronics-pre-reboot.sh.
          GRACE_NORMAL={{ heartbeat_grace_seconds }}
          echo "swintronics-post-boot: restoring healthchecks.io grace to ${GRACE_NORMAL}s..."
          curl -fsS -X POST \
            -H "X-Api-Key: ${HEALTHCHECKS_API_KEY}" \
            -H "Content-Type: application/json" \
            --max-time 5 \
            --retry 2 \
            -d "{\"grace\": ${GRACE_NORMAL}}" \
            "https://healthchecks.io/api/v3/checks/${HEALTHCHECKS_HEARTBEAT_CHECK_UUID}" >/dev/null || \
            echo "swintronics-post-boot: warning: healthchecks.io grace restore failed (proceeding anyway)"

          echo "swintronics-post-boot: done."
        owner: root
        group: root
        mode: '0755'

    - name: Deploy post-boot failure notification script
      when: _has_monitoring_secrets
      copy:
        dest: /usr/local/sbin/swintronics-post-boot-failed.sh
        content: |
          #!/bin/bash
          # Send a Telegram alert if swintronics-post-boot.service fails.
          # Managed by Ansible. Do not edit — changes will be overwritten on next deployment.
          curl -sf -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=❌ swintronics: post-boot monitoring restoration FAILED. Manual intervention required."
        owner: root
        group: root
        mode: '0755'

    - name: Deploy post-boot failure notification systemd unit
      when: _has_monitoring_secrets
      copy:
        dest: /etc/systemd/system/swintronics-post-boot-failed.service
        content: |
          [Unit]
          Description=Swintronics post-boot failure notification

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/swintronics-post-boot-failed.sh
          EnvironmentFile=/etc/swintronics/monitoring.env
        mode: '0644'
      notify: reload systemd

    - name: Deploy post-boot systemd unit
      when: _has_monitoring_secrets
      copy:
        dest: /etc/systemd/system/swintronics-post-boot.service
        content: |
          [Unit]
          Description=Swintronics post-boot: resume healthchecks.io after Gatus is ready
          After=docker.service network-online.target
          Wants=network-online.target
          OnFailure=swintronics-post-boot-failed.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/swintronics-post-boot.sh
          EnvironmentFile=/etc/swintronics/monitoring.env
          RemainAfterExit=yes
          TimeoutStartSec=180

          [Install]
          WantedBy=multi-user.target
        mode: '0644'
      notify: reload systemd

    - name: Enable and start pre-reboot service
      # Must be started, not just enabled: ExecStop only runs at shutdown if
      # the unit is active. Starting is a no-op (ExecStart=/bin/true).
      service:
        name: swintronics-pre-reboot
        enabled: yes
        state: started
      when: _has_monitoring_secrets

    - name: Enable post-boot service
      service:
        name: swintronics-post-boot
        enabled: yes
      when: _has_monitoring_secrets

    # ── Boot-notify hook (every boot, including crash/watchdog recovery) ─────

    - name: Deploy boot-notify script
      copy:
        dest: /usr/local/sbin/swintronics-boot-notify.sh
        content: |
          #!/bin/bash
          # Send a Telegram message on every boot. Indicates whether the previous
          # shutdown was clean (planned reboot) or unclean (crash / watchdog / power loss).
          # Managed by Ansible. Do not edit — changes will be overwritten on next deployment.
          set -euo pipefail

          HOSTNAME=$(hostname -s)
          KERNEL=$(uname -r)
          BOOT_TIME=$(uptime -s)

          SHUTDOWN_NOTE=""
          if journalctl --list-boots --no-pager 2>/dev/null | grep -qE '^[[:space:]]*-1\b'; then
              if journalctl -b -1 -n 100 --no-pager 2>/dev/null \
                  | grep -qiE "Reached target (power-off|reboot|halt|shutdown)\\.target"; then
                  SHUTDOWN_NOTE="✓ prior shutdown was clean"
              else
                  SHUTDOWN_NOTE="⚠️ prior shutdown UNCLEAN (crash, watchdog, or power loss)"
              fi
          else
              SHUTDOWN_NOTE="(no prior boot in journal)"
          fi

          # Shutdown reason recorded by swintronics-pre-reboot.sh; absent on
          # unclean shutdowns (crash/watchdog/power loss).
          REASON_FILE=/var/lib/swintronics/shutdown-reason
          REASON_NOTE="(no shutdown reason recorded)"
          if [[ -f "${REASON_FILE}" ]]; then
              REASON_NOTE="Reason: $(cat "${REASON_FILE}")"
              rm -f "${REASON_FILE}"
          fi

          MESSAGE="🟢 ${HOSTNAME} booted
          Kernel: ${KERNEL}
          Boot time: ${BOOT_TIME}
          ${SHUTDOWN_NOTE}
          ${REASON_NOTE}"

          curl -s -X POST \
              --max-time 10 \
              --retry 2 \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}" >/dev/null
        owner: root
        group: root
        mode: '0755'

    - name: Deploy boot-notify systemd unit
      copy:
        dest: /etc/systemd/system/swintronics-boot-notify.service
        content: |
          [Unit]
          Description=Swintronics boot notification (Telegram)
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/swintronics-boot-notify.sh
          EnvironmentFile=/etc/swintronics/monitoring.env
          TimeoutStartSec=30

          [Install]
          WantedBy=multi-user.target
        mode: '0644'
      notify: reload systemd

    - name: Enable boot-notify service
      service:
        name: swintronics-boot-notify
        enabled: yes

  handlers:
    - name: restart unattended-upgrades
      service:
        name: unattended-upgrades
        state: restarted

    - name: reload systemd
      systemd:
        daemon_reload: yes
